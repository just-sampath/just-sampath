<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 150" width="440" height="150" role="img"
     aria-label="leetcode-guider: An AI coach that won't just hand you the answer">
  
  <style>
    text { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .flow { stroke: #fb923c; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 2 16;
             animation: flow 1.4s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -36; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; opacity: 0; } }
  </style>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#262d37"/>
    </pattern>
    <filter id="rough" filterUnits="userSpaceOnUse" x="0" y="0" width="440" height="150">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#e7e2d9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#fb923c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="438" height="148" rx="16" fill="#14181f" stroke="#2f3743"/>
  <rect x="1" y="1" width="438" height="148" rx="16" fill="url(#dots)"/>
  <g filter="url(#rough)">
    <circle cx="32" cy="36" r="6" fill="none" stroke="#fb923c" stroke-width="2"/>
    <line x1="38" y1="36" x2="50" y2="36" stroke="#fb923c" stroke-width="2"/>
    <circle cx="56" cy="36" r="6" fill="#fb923c"/>
  </g>
  <text x="74" y="42" font-size="17" font-weight="700" fill="#e7e2d9">leetcode-guider</text>
  <text x="26" y="80" font-size="14" fill="#e7e2d9">An AI coach that won't just hand you the answer</text>
  <text x="26" y="102" font-size="12.5" fill="#9aa3ad">Chrome extension · works with 5 LLM providers</text>
  <circle cx="32" cy="127" r="5" fill="#f1e05a"/>
  <text x="44" y="131.5" font-size="12.5" fill="#9aa3ad">JavaScript</text>
  <text x="416" y="131.5" text-anchor="end" font-size="12.5" font-weight="600" fill="#fb923c">view repo →</text>
</svg>
