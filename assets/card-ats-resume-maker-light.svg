<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 150" width="440" height="150" role="img"
     aria-label="ats-resume-maker: An AI skill that tailors résumés without inventing facts">
  
  <style>
    text { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .flow { stroke: #c2410c; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 2 16;
             animation: flow 1.4s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -36; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; opacity: 0; } }
  </style>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#e6dfd2"/>
    </pattern>
    <filter id="rough" filterUnits="userSpaceOnUse" x="0" y="0" width="440" height="150">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#24292f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="438" height="148" rx="16" fill="#fbf7f0" stroke="#d9d1c3"/>
  <rect x="1" y="1" width="438" height="148" rx="16" fill="url(#dots)"/>
  <g filter="url(#rough)">
    <circle cx="32" cy="36" r="6" fill="none" stroke="#c2410c" stroke-width="2"/>
    <line x1="38" y1="36" x2="50" y2="36" stroke="#c2410c" stroke-width="2"/>
    <circle cx="56" cy="36" r="6" fill="#c2410c"/>
  </g>
  <text x="74" y="42" font-size="17" font-weight="700" fill="#24292f">ats-resume-maker</text>
  <text x="26" y="80" font-size="14" fill="#24292f">An AI skill that tailors résumés without inventing facts</text>
  <text x="26" y="102" font-size="12.5" fill="#5f646b">4 validation gates · real PDF output</text>
  <circle cx="32" cy="127" r="5" fill="#3572A5"/>
  <text x="44" y="131.5" font-size="12.5" fill="#5f646b">Python</text>
  <text x="416" y="131.5" text-anchor="end" font-size="12.5" font-weight="600" fill="#c2410c">view repo →</text>
</svg>
