<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img"
     aria-label="Sampath: full stack and applied AI engineer, backend and system design at heart. Now: making AI systems reliable and cost-effective at scale.">
  
  <style>
    text { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .flow { stroke: #fb923c; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 2 16;
             animation: flow 1.4s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -36; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; opacity: 0; } }
  </style>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#262d37"/>
    </pattern>
    <filter id="rough" filterUnits="userSpaceOnUse" x="0" y="0" width="900" height="440">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#e7e2d9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#fb923c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="898" height="438" rx="16" fill="#14181f" stroke="#2f3743"/>
  <rect x="1" y="1" width="898" height="438" rx="16" fill="url(#dots)"/>
  <text x="48" y="78" font-size="40" font-weight="700" fill="#e7e2d9" letter-spacing="-0.5">Sampath</text>
  <text x="50" y="108" font-size="16" fill="#9aa3ad">full stack &amp; applied AI engineer · backend &amp; system design at heart</text>

  <rect x="48" y="128" width="54" height="24" rx="12" fill="#fb923c"/>
  <text x="75" y="144.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14181f" letter-spacing="1">NOW</text>
  <text x="114" y="145" font-size="16" fill="#e7e2d9">making AI systems reliable &amp; cost-effective at scale</text>

  <g>
    <circle cx="58" cy="230.0" r="5" fill="#fb923c"/>
    <text x="70" y="235.0" font-size="15" fill="#e7e2d9">request</text>
    
    <line x1="136" y1="230.0" x2="186" y2="230.0" stroke="#e7e2d9" stroke-width="1.6" marker-end="url(#arrow)" filter="url(#rough)"/>
    <line class="flow" x1="140" y1="230.0" x2="176" y2="230.0"/>
    
    <rect x="190" y="206" width="150" height="48" rx="10" fill="#1b2029" stroke="#e7e2d9" stroke-width="1.6" filter="url(#rough)"/>
    <text x="265.0" y="236.0" text-anchor="middle" font-size="17" font-weight="600" fill="#e7e2d9">boundary</text>
    <text x="265.0" y="194" text-anchor="middle" font-size="12.5" fill="#9aa3ad">budget: time + cost</text>
    
    <line x1="342" y1="230.0" x2="392" y2="230.0" stroke="#e7e2d9" stroke-width="1.6" marker-end="url(#arrow)" filter="url(#rough)"/>
    <line class="flow" x1="346" y1="230.0" x2="382" y2="230.0"/>
    
    <rect x="396" y="206" width="130" height="48" rx="10" fill="#1b2029" stroke="#e7e2d9" stroke-width="1.6" filter="url(#rough)"/>
    <text x="461.0" y="236.0" text-anchor="middle" font-size="17" font-weight="600" fill="#e7e2d9">model</text>
    <text x="461.0" y="194" text-anchor="middle" font-size="12.5" fill="#9aa3ad">suggests</text>
    
    <line x1="528" y1="230.0" x2="578" y2="230.0" stroke="#e7e2d9" stroke-width="1.6" marker-end="url(#arrow)" filter="url(#rough)"/>
    <line class="flow" x1="532" y1="230.0" x2="568" y2="230.0"/>
    
    <rect x="582" y="206" width="130" height="48" rx="10" fill="#1b2029" stroke="#e7e2d9" stroke-width="1.6" filter="url(#rough)"/>
    <text x="647.0" y="236.0" text-anchor="middle" font-size="17" font-weight="600" fill="#e7e2d9">check</text>
    <text x="647.0" y="194" text-anchor="middle" font-size="12.5" fill="#9aa3ad">code decides</text>
    
    <line x1="714" y1="230.0" x2="770" y2="230.0" stroke="#e7e2d9" stroke-width="1.6" marker-end="url(#arrow)" filter="url(#rough)"/>
    <line class="flow" x1="718" y1="230.0" x2="760" y2="230.0"/>
    <circle cx="796" cy="230.0" r="22" fill="#4a2f1d" stroke="#fb923c" stroke-width="2" filter="url(#rough)"/>
    <path d="M785 230.0 l7 7 l13 -14" fill="none" stroke="#fb923c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="796" y="194" text-anchor="middle" font-size="12.5" fill="#9aa3ad">reliable</text>

    <path d="M647 254 V294 H461 V262" fill="none" stroke="#fb923c" stroke-width="1.8"
          stroke-dasharray="6 6" marker-end="url(#arrow-accent)" filter="url(#rough)"/>
    <text x="554" y="316" text-anchor="middle" font-size="13" font-weight="600" fill="#fb923c">retry ≤ n, then fail loudly</text>

    
    <line x1="265" y1="254" x2="265" y2="346" stroke="#9aa3ad" stroke-width="1.4" stroke-dasharray="2 5" stroke-linecap="round"/>
    <circle cx="265" cy="350" r="3.5" fill="#9aa3ad"/>
    
    <line x1="420" y1="254" x2="420" y2="346" stroke="#9aa3ad" stroke-width="1.4" stroke-dasharray="2 5" stroke-linecap="round"/>
    <circle cx="420" cy="350" r="3.5" fill="#9aa3ad"/>
    
    <line x1="690" y1="254" x2="690" y2="346" stroke="#9aa3ad" stroke-width="1.4" stroke-dasharray="2 5" stroke-linecap="round"/>
    <circle cx="690" cy="350" r="3.5" fill="#9aa3ad"/>
    
    <line x1="796" y1="252.0" x2="796" y2="346" stroke="#9aa3ad" stroke-width="1.4" stroke-dasharray="2 5" stroke-linecap="round"/>
    <circle cx="796" cy="350" r="3.5" fill="#9aa3ad"/>
    <rect x="190" y="350" width="660" height="50" rx="25.0" fill="#1b2029" stroke="#e7e2d9"
          stroke-width="1.6" filter="url(#rough)"/>
    <g transform="translate(214 375.0)" fill="none" stroke="#fb923c" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 0 H6 L10 -9 L16 9 L21 -4 L24 0 H30"/>
    </g>
    <text x="256" y="381.0" font-size="17" font-weight="600" fill="#e7e2d9">observe</text>
    <text x="336" y="380.0" font-size="13.5" fill="#9aa3ad">traces · latency · cost · answer quality, on every step</text>
  </g>
</svg>
