<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 278" width="900" height="278" role="img"
     aria-label="Toolbox: build: Python, TypeScript, Node.js, FastAPI, Express; store: MongoDB, PostgreSQL, Redis, Qdrant, Pinecone; run: AWS, Azure Functions, Docker, BullMQ; think: Claude, OpenAI, LangGraph, LlamaIndex; learning: Go">
  
  <style>
    text { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .flow { stroke: #c2410c; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 2 16;
             animation: flow 1.4s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -36; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; opacity: 0; } }
  </style>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
